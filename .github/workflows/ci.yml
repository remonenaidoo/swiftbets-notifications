name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet:
    uses: remonenaidoo/swiftbets-platform/.github/workflows/dotnet.yml@main
    with:
      images: '[{"name": "swiftbets-notifications", "dockerfile": "deploy/SwiftBets.Notifications.Api.Dockerfile"}, {"name": "swiftbets-notifications-migrator", "dockerfile": "deploy/SwiftBets.Notifications.Migrator.Dockerfile"}]'
      coverage: true
      coverage-floors: '{"SwiftBets.Notifications.Domain": {"branch": 90}, "SwiftBets.Notifications.Application": {"branch": 90}}'
    permissions:
      contents: read
      packages: write
      security-events: write
